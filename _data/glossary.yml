- title: Rasa
  japanese: "रस — «aesthetic flavor or emotional essence»"
  category: Aesthetics & Philosophy
  description: "A foundational concept in classical Indian aesthetics (Natya Shastra) denoting the emotional atmosphere evoked in the audience through visual, dramatic, or poetic sign systems."

- title: Mono no aware
  japanese: "物の哀れ — «the pathos of things»"
  category: Aesthetics & Philosophy
  description: "A traditional Japanese aesthetic principle expressing gentle sadness and awareness of the impermanence and fragility of beauty, frequently coded in visual culture through falling cherry blossoms or fading summer light."

- title: Darshana
  japanese: "दर्शन — «sacred viewing or auspicious sight»"
  category: Visual Codes
  description: "A key visual and religious code in South Asian traditions where seeing and being seen by a sacred image or deity establishes a reciprocal semiotic and spiritual connection."
