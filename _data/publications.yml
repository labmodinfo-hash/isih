    authors: "Rubtsova A.V., Rubtsova M.V."
    source: "Philological Sciences Bulletin (Vestnik filologicheskikh nauk), 2026, Vol. 6, No. 4, pp. 123–128 (in Russian)"
    doi: "10.62257/2782-5329-2026-4-123-128"
    abstract: "The article analyzes the evolution of ecocriticism from ecopoetics to econarratology using the example of the anime series 'Dungeon Meshi' (Delicious in Dungeon, 2024), where the underground biosphere acts as a narrative engine through food chains, monster hierarchies, and environmental determinism. Econarratology is defined as a methodological approach studying how the artistic environment operates as an actant possessing narrative agency."
