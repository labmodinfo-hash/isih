- year: 2026
  category: Japanese Visual Semiotics
  title: "Semiotic Codes and the Visual Register of Contemporary Screen Animation: A Comparative Multimodal Analysis [in Russian]"
  authors: "Rubtcova M.V."
  source: "International Research Journal (Mezhdunarodnyy nauchno-issledovatel'skiy zhurnal), 2026, No. 10 (172) (in Russian)"
  doi: "10.60797/IRJ.2026.172.5"
  abstract: "The purpose of the study is to identify and systematize the semiotic codes that shape the visual register of contemporary Japanese screen animation across four cult series: Neon Genesis Evangelion, Serial Experiments Lain, Monster, and Attack on Titan. Applying an original six-code analytical scheme (iconic, narrative-genre, cultural-symbolic, meta-cinematographic, kinetic-plastic, and chromatic), the author demonstrates that the visual register of contemporary anime functions as an open, self-describing semiotic system rather than a mere illustrative accompaniment."
  pdf: "/assets/pdf/rubtsova-2026-semiotic-codes.pdf"
  cite: "Rubtcova, M. V. (2026). Semiotic Codes and the Visual Register of Contemporary Screen Animation: A Comparative Multimodal Analysis. International Research Journal, (10/172). https://doi.org/10.60797/IRJ.2026.172.5 [in Russian]"

- year: 2026
  category: Japanese Visual Semiotics
  title: "Representing the Anomalous: Developing and Testing a Multimodal Content Analysis [in Russian]"
  authors: "Rubtcova M.V."
  source: "Russian Linguistic Bulletin, 2026, No. 9 (81) (in Russian)"
  doi: "10.60797/RULB.2026.81.3"
  abstract: "Based on directed multimodal content analysis of thirty key scenes from Puella Magi Madoka Magica, Attack on Titan, and Vinland Saga, this study examines the transformation of the anomalous in post-2010 anime. Integrating Jungian psychology (the Shadow archetype) and Hayao Kawai's concept of 'emptiness' (kara), the article identifies three scenarios of monster humanization—kawaii subversion, linear degrotesquification, and narrative internalization—showing how the monster shifts from an external Other into a mirror of human subjectivity."
  pdf: "/assets/pdf/rubtsova-2026-representing-anomalous.pdf"
  cite: "Rubtcova, M. V. (2026). Representing the Anomalous: Developing and Testing a Multimodal Content Analysis. Russian Linguistic Bulletin, (9/81). https://doi.org/10.60797/RULB.2026.81.3 [in Russian]"

- year: 2026
  category: Theory & Methodology
  title: "Mapping the Mind as a Method for Reconstructing the Urban Space of 18th-Century St. Petersburg [in Russian]"
  authors: "Rubtsova M.V., Pavenkov V.G."
  source: "Historical Bulletin (Istoricheskiy byulleten'), 2026, Vol. 9, No. 6, pp. 182–187 (in Russian)"
  doi: "10.58224/2658-5685-2026-9-6-182-187"
  abstract: "This article analyzes the concept of cognitive history developed by O.M. Medushevskaya and operationalizes the method of 'mapping the mind' to reconstruct historical structures of consciousness through spatial and architectural artifacts. Examining 18th-century St. Petersburg across geometric, semantic, and narrative levels, the authors interpret its regular layout and institutional placement as a materialized cognitive text of the Petrine Enlightenment."
  pdf: "/assets/pdf/rubtsova-2026-mapping-mind.pdf"
  cite: "Rubtsova, M. V., & Pavenkov, V. G. (2026). Mapping the Mind as a Method for Reconstructing the Urban Space of 18th-Century St. Petersburg. Historical Bulletin, 9(6), 182–187. https://doi.org/10.58224/2658-5685-2026-9-6-182-187 [in Russian]"

- year: 2026
  category: Japanese Visual Semiotics
  title: "The Rashomon Effect and Ethical Ambivalence in Contemporary Media Culture [in Russian]"
  authors: "Rubtcova M.V."
  source: "Communicology (Kommunikologiya), 2026, Vol. 14, No. 2, pp. 110–117 (in Russian)"
  doi: "10.21453/2311-3065-2026-14-2-110-117"
  abstract: "The study examines the implementation of the 'Rashomon effect' in the anime series Takopi's Original Sin (2025) as a holistic ethical and epistemological model. Drawing on Jean Genette's narratology of focalization and unreliable narration theory, the article shows how rigid internal focalization, temporal nonlinearity, and the absence of an objective resolution transform a search for guilt into ethical polyphony."
  pdf: "/assets/pdf/rubtsova-2026-rashomon-effect.pdf"
  cite: "Rubtcova, M. V. (2026). The Rashomon Effect and Ethical Ambivalence in Contemporary Media Culture. Communicology, 14(2), 110–117. https://doi.org/10.21453/2311-3065-2026-14-2-110-117 [in Russian]"

- year: 2026
  category: Japanese Visual Semiotics
  title: "Analysis of Communicative Models of Subjectivity in Popular Culture [in Russian]"
  authors: "Rubtcova M.V."
  source: "Russian Linguistic Bulletin, 2026, No. 6 (78) (in Russian)"
  doi: "10.60797/RULB.2026.78.19"
  abstract: "Contemporary communication studies face the need to examine complex philosophical and psychological concepts of subjectivity conveyed by popular culture. Drawing on C.G. Jung's analytical psychology and Hayao Kawai's Buddhist-Jungian synthesis, this study identifies three communicative models of subjectivity in Naoki Urasawa's anime series 'Monster': the 'karmic dyad', the 'split subject' (negative 'empty self'), and the 'dialogical response'."
  pdf: "/assets/pdf/rubtsova-2026-communicative-models.pdf"
  cite: "Rubtcova, M. V. (2026). Analysis of Communicative Models of Subjectivity in Popular Culture. Russian Linguistic Bulletin, (6/78). https://doi.org/10.60797/RULB.2026.78.19 [in Russian]"

