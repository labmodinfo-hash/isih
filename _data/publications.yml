- year: 2026
  category: Comparative Mythology
  title: "The Archetypal Nature of Ethnicity: C.G. Jung's Hypothetical Response to the Dichotomy of Primordialism and Constructivism [in Russian]"
  authors: "Rubtsova A.V., Rubtsova M.V."
  source: "Academic Collection / Proceedings, 2026, pp. 342–345 (in Russian)"
  doi: ""
  abstract: "This article examines the methodological opposition between primordialism and constructivism in modern ethnology and social anthropology through the lens of C.G. Jung's analytical psychology. It is concluded that ethnicity in the Jungian paradigm is a symbolic system rooted in the collective unconscious (archetypal aspect) yet actualized through cultural consciousness and social context (constructivist aspect), proposing the 'psychic reality of ethnicity' as a third way."
  pdf: "/assets/pdf/rubtsova-2026-archetypal-ethnicity.pdf"
  cite: "Rubtsova, A. V., & Rubtsova, M. V. (2026). The Archetypal Nature of Ethnicity: C.G. Jung's Hypothetical Response to the Dichotomy of Primordialism and Constructivism, pp. 342–345. [in Russian]"

