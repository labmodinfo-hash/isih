  - year: 2026
    category: Japanese Visual Semiotics
    title: "Analysis of Communicative Models of Subjectivity in Popular Culture [in Russian]"
    authors: "Rubtcova M.V."
    source: "Russian Linguistic Bulletin, 2026, No. 6 (78) (in Russian)"
    doi: "10.60797/RULB.2026.78.19"
    abstract: "Contemporary communication studies are faced with the need to study the complex philosophical and psychological concepts of subjectivity and identity conveyed by popular culture. Japanese animation (anime) serves as a unique media text of contemporary popular culture, in which Eastern and Western intellectual traditions engage in dialogue. Drawing on C.G. Jung's analytical psychology and Hayao Kawai's Buddhist-Jungian synthesis, this study identifies three communicative models of subjectivity in Naoki Urasawa's anime series 'Monster': the 'karmic dyad', the 'split subject' (negative 'empty self'), and the 'dialogical response'."
    pdf: "/assets/pdf/rubtsova-2026-communicative-models.pdf"
    cite: "Rubtcova, M. V. (2026). Analysis of Communicative Models of Subjectivity in Popular Culture. Russian Linguistic Bulletin, (6/78). https://doi.org/10.60797/RULB.2026.78.19 [in Russian]"

  - year: 2026
    category: Comparative Mythology
    title: "Transformation of Christian Eschatology and Demonology in Japanese Mass Culture [in Russian]"
    authors: "Rubtsova A.V."
    source: "Culture and Civilization (Kul'tura i tsivilizatsiya), 2026, Vol. 16, No. 3A, pp. 97–104 (in Russian)"
    doi: "10.34670/AR.2026.53.81.010"
    abstract: "The article examines the reception of Christian religious symbols, eschatological concepts, and demonology in contemporary Japanese mass culture (manga and anime). Based on works such as 'Evangelion,' 'Berserk,' 'Vinland Saga,' and 'The Summer Hikaru Died,' a philosophical and religious studies analysis of cultural adaptation and syncretism is carried out using J.B. Thomas's concept of 'Vernacular Religion' and H. Azuma's 'Database' model, proposing a fourfold typology of religious representation."
