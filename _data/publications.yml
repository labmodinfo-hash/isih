  doi: "10.62257/2782-5329-2026-4-123-128"
  abstract: "The article analyzes the evolution of ecocriticism from ecopoetics to econarratology using the example of the anime series Dungeon Meshi (Delicious in Dungeon, 2024), where the underground biosphere acts as a narrative engine through food chains, monster hierarchies, and environmental determinism. Econarratology is defined as a methodological approach studying how the environment operates as an actant possessing narrative agency."
