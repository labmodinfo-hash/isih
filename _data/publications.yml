- year: 2026
  category: Theory & Methodology
  title: "The Ontological Turn in Narratology: The Concept of World Autonomy in Mark J.P. Wolf's Theory [in Russian]"
  authors: "Rubtsova A.V., Rubtsova M.V., Martyanova N.A."
  source: "Kazan Science (Kazanskaya nauka), 2026, No. 3, pp. 616–618 (in Russian)"
  doi: ""
  abstract: "This article examines Mark J.P. Wolf's theory of imaginary worlds within the context of the early 21st-century interdisciplinary 'ontological turn' across literary studies, anthropology, and media research. Tracing the paradigm shift from classical narratocentrism to world-building autonomy, the authors draw parallels with ontological social anthropology and evaluate Wolf's concepts of subcreation and narrative incompleteness."
