  title: "Cultural Specifics of Japanese Information Behavior [in Russian]"
  authors: "Rubtsova A.V., Pavenkov V.G."
  source: "Academic Proceedings / Journal, 2026, pp. 703–706 (in Russian)"
  doi: ""
  abstract: "The article analyzes cultural specifics of Japanese information behavior through attitudes toward cyberspace and information-seeking practices. Based on comparative studies, it identifies a distinct configuration of Japanese cyberculture—preference for anonymity, separation of online and offline networks, localized interpersonal trust, and controlled emotional distance—challenging universalist technodeterminist models."
