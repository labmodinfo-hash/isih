  doi: "10.34670/AR.2026.53.81.010"
  abstract: "The article examines the reception of Christian religious symbols, eschatological concepts, and demonology in contemporary Japanese mass culture (manga and anime). Based on Evangelion, Berserk, Vinland Saga, and The Summer Hikaru Died, a philosophical and religious studies analysis of syncretism is carried out using J.B. Thomas's concept of 'Vernacular Religion' and H. Azuma's 'Database' model, proposing a fourfold typology of religious representation."
